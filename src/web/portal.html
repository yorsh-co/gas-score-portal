<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="mobile-web-app-capable" content="no" />
    <link rel="stylesheet" href="portal.css" />
  </head>

  <body>
    <main>
      <div id="user-scores" class="card">
        <div class="title-container">
          <img
            src="https://res.cloudinary.com/dsbaiaeqs/image/upload/v1772483417/banner_1_rh8fon.png"
            alt="logo"
            width="100"
            height="100"
          />
          <h1 id="portal-title">Score Portal</h1>
        </div>

        <div class="form-group">
          <input
            id="email"
            type="email"
            placeholder="Enter the email used in the quizzes"
            data-i18n-placeholder="portal.emailPlaceholder"
            class="align-center"
          />
        </div>

        <div class="button-container">
          <button
            id="load-btn"
            class="lg full-width spinner-padding"
            data-i18n="portal.loadButton"
          >
            View your scores
          </button>
        </div>

        <div id="error" class="error align-center"></div>

        <table id="summary-table" hidden>
          <tbody>
            <tr>
              <th data-i18n="portal.labelName">Name</th>
              <td id="user-name" class="cell-ellipsis"></td>
            </tr>
            <tr>
              <th data-i18n="portal.labelUsers">User(s)</th>
              <td id="user-ids" class="cell-ellipsis"></td>
            </tr>
            <tr>
              <th data-i18n="portal.labelResponses">Responses</th>
              <td id="user-num-responses"></td>
            </tr>
            <tr>
              <th data-i18n="portal.labelAverage">Average score</th>
              <td id="user-average-score"></td>
            </tr>
          </tbody>
        </table>

        <hr />

        <table id="scores-table" class="tr-border-bottom" hidden>
          <thead>
            <tr>
              <th data-i18n="portal.labelForm">Module</th>
              <th class="form-score" data-i18n="portal.labelScore">Score</th>
            </tr>
          </thead>
          <tbody id="scores-tbody"></tbody>
        </table>

        <div id="empty-state" class="empty" data-i18n="portal.empty" hidden>
          No scores found.
        </div>

        <div id="scores-note">
          <p id="last-update-timestamp"></p>
          <p data-i18n="portal.note">
            New scores may take up to an hour to appear after a form is
            submitted.
          </p>
        </div>
      </div>

      <template id="row-template">
        <tr>
          <td class="form-name cell-ellipsis"></td>
          <td class="form-score"></td>
        </tr>
      </template>
    </main>

    <footer>
      <a href="https://jspworkspacesolutions.com/" target="_blank"
        >© 2026 Yorsh</a
      >
    </footer>

    <script src="../shared/i18n/en.js"></script>
    <script src="../shared/i18n/pt-BR.js"></script>
    <script src="../shared/i18n/i18n.js"></script>
    <script src="vendor/gas-webapp/gas-webapp.config.js"></script>
    <script src="vendor/gas-webapp/gas-webapp.errors.js"></script>
    <script src="vendor/gas-webapp/gas-webapp.client.js"></script>
    <script src="portal.js"></script>
  </body>
</html>
