<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="mobile-web-app-capable" content="no" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Crect x='7' y='17' width='4' height='8' rx='1' fill='%23fff' opacity='.6'/%3E%3Crect x='14' y='12' width='4' height='13' rx='1' fill='%23fff' opacity='.8'/%3E%3Crect x='21' y='7' width='4' height='18' rx='1' fill='%23fff'/%3E%3C/svg%3E"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="portal.fonts.css" />
    <link rel="stylesheet" href="portal.css" />
  </head>

  <body>
    <main>
      <div id="user-scores" class="card">
        <div class="title-container">
          <img
            id="portal-logo"
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='64' height='64' role='img' aria-label='Score Portal'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Crect x='14' y='34' width='8' height='16' rx='2' fill='%23fff' opacity='.6'/%3E%3Crect x='28' y='24' width='8' height='26' rx='2' fill='%23fff' opacity='.8'/%3E%3Crect x='42' y='14' width='8' height='36' rx='2' fill='%23fff'/%3E%3C/svg%3E"
            alt=""
            width="72"
            height="72"
          />
          <h1 id="portal-title">Score Portal</h1>
        </div>

        <div
          id="error"
          class="error align-center"
          role="alert"
          aria-live="assertive"
        ></div>

        <form id="email-panel" novalidate>
          <div class="form-group">
            <label for="email" data-i18n="portal.emailLabel"
              >Email used in the quizzes</label
            >
            <input
              id="email"
              type="email"
              autocomplete="email"
              placeholder="Enter the email used in the quizzes"
              data-i18n-placeholder="portal.emailPlaceholder"
              class="align-center"
            />
          </div>
          <div class="button-container">
            <button
              id="send-btn"
              type="submit"
              class="lg full-width spinner-padding"
              data-i18n="portal.sendCodeButton"
            >
              Send me a code
            </button>
          </div>
        </form>

        <form id="code-panel" novalidate hidden>
          <div class="form-group">
            <label for="code" data-i18n="portal.codeLabel">Access code</label>
            <p id="code-help" class="hint"></p>
            <input
              id="code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]{6}"
              aria-describedby="code-help"
              class="align-center code-input"
            />
          </div>
          <div class="button-container">
            <button
              id="verify-btn"
              type="submit"
              class="lg full-width spinner-padding"
              data-i18n="portal.verifyButton"
            >
              View your scores
            </button>
          </div>
          <div class="link-row">
            <button
              id="resend-btn"
              type="button"
              class="link"
              disabled
            ></button>
            <button
              id="change-email-btn"
              type="button"
              class="link"
              data-i18n="portal.changeEmail"
            >
              Use another email
            </button>
          </div>
        </form>

        <div id="results-panel" tabindex="-1" hidden>
          <div class="link-row end">
            <button
              id="sign-out-btn"
              type="button"
              class="link"
              data-i18n="portal.signOut"
            >
              Sign out
            </button>
          </div>

          <table id="summary-table" hidden>
            <tbody>
              <tr>
                <th data-i18n="portal.labelName">Name</th>
                <td id="user-name" class="cell-ellipsis"></td>
              </tr>
              <tr>
                <th data-i18n="portal.labelUsers">User(s)</th>
                <td id="user-ids" class="cell-ellipsis"></td>
              </tr>
              <tr>
                <th data-i18n="portal.labelResponses">Responses</th>
                <td id="user-num-responses"></td>
              </tr>
              <tr>
                <th data-i18n="portal.labelAverage">Average score</th>
                <td id="user-average-score"></td>
              </tr>
            </tbody>
          </table>

          <hr />

          <table id="scores-table" class="tr-border-bottom" hidden>
            <thead>
              <tr>
                <th data-i18n="portal.labelForm">Module</th>
                <th class="form-score" data-i18n="portal.labelScore">Score</th>
              </tr>
            </thead>
            <tbody id="scores-tbody"></tbody>
          </table>

          <div id="empty-state" class="empty" data-i18n="portal.empty" hidden>
            No scores found.
          </div>

          <div id="scores-note">
            <p id="last-update-timestamp"></p>
            <p data-i18n="portal.note">
              New scores may take up to an hour to appear after a form is
              submitted.
            </p>
          </div>
        </div>
      </div>

      <template id="row-template">
        <tr>
          <td class="form-name cell-ellipsis"></td>
          <td class="form-score"></td>
        </tr>
      </template>
    </main>

    <script src="../shared/i18n/en.js"></script>
    <script src="../shared/i18n/pt-BR.js"></script>
    <script src="../shared/i18n/i18n.js"></script>
    <script src="vendor/gas-webapp/gas-webapp.config.js"></script>
    <script src="vendor/gas-webapp/gas-webapp.errors.js"></script>
    <script src="vendor/gas-webapp/gas-webapp.client.js"></script>
    <script src="vendor/gas-webapp/gas-webapp.reporter.js"></script>
    <script src="portal.state.js"></script>
    <script src="portal.js"></script>
  </body>
</html>
