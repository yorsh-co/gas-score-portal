name: Deploy

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  deploy:
    uses: yorsh-co/gasdev/.github/workflows/gas-deploy.yml@v3.3.0-beta.0
    with:
      environment: ${{ github.ref_name == 'main' && 'live' || 'dev' }}
      build: npm run build && node scripts/check-public-globals.js dist
    secrets: inherit
